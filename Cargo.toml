[package]
name = "rest-api-wl-shared"
version = "9.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
auth-middleware = ["service-sdk/my-nosql-data-reader-sdk"]


[dependencies]
service-sdk = { tag = "0.5.0", git = "https://github.com/MyJetTools/service-sdk.git", features = [
    "macros",
    "my-nosql-sdk",
] }

# my-http-server 0.9.0 moved the model derives into my-http-utils; they emit bare
# `my_http_utils::` paths, so the crate must be in our extern prelude.
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }

rust-common = { tag = "0.1.1", git = "https://github.com/MyJetTools/rust-common", features = [
    "country-code",
] }

regex = "1.5.4"
phonenumber = "0.3"

lazy_static = "*"
serde = { version = "*", features = ["derive"] }
serde_repr = "*"
serde_json = "*"
async-trait = "*"
